[pytest]
# Minimum pytest version
minversion = 7.0

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode for pytest-asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output configuration
addopts = 
    -v                          # Verbose output
    --tb=short                  # Shorter tracebacks
    --strict-markers            # Error on unknown markers
    -ra                         # Show summary of all non-passing tests
    --cov=src                   # Coverage for src directory
    --cov-report=term-missing   # Show missing lines in terminal
    --cov-report=html           # Generate HTML coverage report
    --cov-fail-under=80         # Fail if coverage drops below 80%

# Custom markers (register these to avoid warnings)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may need external services)
    slow: Tests that take a long time to run
    asyncio: Async tests (handled by pytest-asyncio)

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
