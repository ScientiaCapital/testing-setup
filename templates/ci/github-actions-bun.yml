# GitHub Actions Workflow: Bun Testing
#
# This workflow runs tests for Bun projects.
# Copy to .github/workflows/test.yml in your project.
#
# Features:
# - Bun setup via oven-sh/setup-bun@v2
# - TypeScript type checking
# - Unit tests with bun:test
# - Coverage reporting
# - Build verification
# - Dependency caching (~/.bun/install/cache)

name: Bun Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'bunfig.toml'
      - 'bun.lockb'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.ts'
      - '**.tsx'
      - '**.js'
      - '**.jsx'
      - 'bunfig.toml'
      - 'bun.lockb'
      - 'package.json'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------
  # Linting and Type Checking
  # -----------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript check
        run: bunx tsc --noEmit || echo "TypeScript check not configured"

      - name: Run linter
        run: bun run lint || echo "Lint script not configured"

  # -----------------------------------------------------------------
  # Unit Tests
  # -----------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun test --coverage
        env:
          CI: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # -----------------------------------------------------------------
  # Build Verification
  # -----------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build || echo "Build script not configured"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            build/
            out/
          if-no-files-found: ignore
