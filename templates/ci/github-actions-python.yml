# GitHub Actions Workflow: Python Testing
#
# This workflow runs tests for Python projects.
# Copy to .github/workflows/test.yml in your project.
#
# Features:
# - Multi-Python version testing (3.10, 3.11, 3.12)
# - Caching for faster builds
# - Coverage reporting
# - Type checking with mypy
# - Linting with ruff
# - Separate unit and integration test runs

name: Python Tests

on:
  push:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'requirements*.txt'
  workflow_dispatch:  # Allow manual trigger

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: '3.11'

jobs:
  # -----------------------------------------------------------------
  # Linting and Type Checking (runs first, fast)
  # -----------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]" || pip install -r requirements-dev.txt || pip install -r requirements.txt

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

      - name: Run mypy type checker
        run: mypy . --ignore-missing-imports
        continue-on-error: true  # Don't fail build on type errors (optional)

  # -----------------------------------------------------------------
  # Unit Tests (runs on multiple Python versions)
  # -----------------------------------------------------------------
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Only run tests if linting passes

    strategy:
      fail-fast: false  # Continue other versions if one fails
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements-dev.txt || pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "not integration and not slow" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=junit-results.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == env.PYTHON_VERSION_DEFAULT
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: junit-results.xml

  # -----------------------------------------------------------------
  # Integration Tests (runs separately, may need secrets)
  # -----------------------------------------------------------------
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test  # Only run after unit tests pass

    # Only run on main branch or when explicitly requested
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-integration')

    env:
      # Add your secrets for integration tests
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # API_KEY: ${{ secrets.API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements-dev.txt || pip install -r requirements.txt

      - name: Run integration tests
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            -m "integration" \
            --timeout=120

  # -----------------------------------------------------------------
  # Build Check (ensures package builds correctly)
  # -----------------------------------------------------------------
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
